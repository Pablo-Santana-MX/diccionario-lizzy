<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 Diccionario Lizzy 🌸</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- 🔹 PWA: Enlace al manifest y color de tema -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f8e9f4">
</head>
<body>
  
  <div class="contenedor-principal">
    <h1 class="titulo">Diccionario Español</h1>
    <h2 class="subtitulo">🌸 Hecho especialmente para ti 🌸</h2>
    
    <div class="caja-busqueda">
      <input id="entrada" type="text" placeholder="Escribe una palabra..." autocomplete="off">
      <button onclick="buscar()">Buscar</button>
    </div>
    
    <div id="sugerencias-container">
        <div id="sugerencias"></div>
    </div>
  </div>

  <div id="resultado" class="oculto"></div>

<script>
  let diccionarioCache = null;

  // 🔹 Cargamos directamente el archivo rae_dictionary.json
  fetch("../data/rae_dictionary.json")
    .then(res => res.json())
    .then(diccionario => {
      // Convertimos la lista en un objeto indexado por palabra normalizada
      diccionarioCache = {};
      diccionario.forEach(entry => {
        let palabraNorm = quitarAcentos(entry.word.toLowerCase().trim());
        // 🔹 quitar signos de puntuación al final
        palabraNorm = palabraNorm.replace(/[.,;:]+$/g, "");
        diccionarioCache[palabraNorm] = entry;
      });
    })
    .catch(err => console.error("Error al cargar el diccionario:", err));

  function quitarAcentos(texto) {
    return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function mostrarSugerencias(textoRaw) {
    const sugerenciasDiv = document.getElementById("sugerencias");
    const containerDiv = document.getElementById("sugerencias-container");
    sugerenciasDiv.innerHTML = "";
    
    const texto = quitarAcentos(textoRaw.toLowerCase().trim()).replace(/[.,;:]+$/g, "");
    if (!texto || !diccionarioCache) {
        containerDiv.style.display = "none";
        return;
    }

    const coincidencias = Object.keys(diccionarioCache)
      .filter(palabra => palabra.startsWith(texto))
      .slice(0, 5); 

    if (coincidencias.length === 0) {
        containerDiv.style.display = "none";
        return;
    }

    containerDiv.style.display = "block";

    coincidencias.forEach(palabra => {
      const datos = diccionarioCache[palabra];
      const preview = datos.definitions?.[0] || "";
      const categoria = datos.pos && datos.pos !== "Desconocida" 
                        ? `<span class="categoria-badge">${datos.pos}</span>` 
                        : "";

      const div = document.createElement("div");
      div.className = "sugerencia";
      div.innerHTML = `<strong>${palabra}</strong> ${categoria}<br><span class="preview">${preview}</span>`;
      div.onclick = () => {
        document.getElementById("entrada").value = palabra;
        containerDiv.style.display = "none";
        buscar();
      };
      sugerenciasDiv.appendChild(div);
    });
  }

  function buscar() {
    const inputRaw = document.getElementById("entrada").value;
    const palabra = quitarAcentos(inputRaw.toLowerCase().trim()).replace(/[.,;:]+$/g, "");
    const resultadoDiv = document.getElementById("resultado");
    
    if (!palabra || !diccionarioCache) return;

    document.getElementById("sugerencias-container").style.display = "none";
    resultadoDiv.classList.remove("oculto");
    resultadoDiv.classList.remove("error-box");

    const datos = diccionarioCache[palabra];
    let html = "";

    if (datos) {
      const catHTML = datos.pos !== "Desconocida" 
          ? `<span class="categoria-tag">${datos.pos}</span>` : "";
      
      html += `<h2>${inputRaw.toLowerCase()} ${catHTML}</h2>`;

      if (datos.definitions && datos.definitions.length > 0) {
        html += "<h3>🌸 ¿Qué significa?</h3><ol class='lista-definiciones'>";
        datos.definitions.forEach(def => {
          html += `<li>${def}</li>`;
        });
        html += "</ol>";
      }

      resultadoDiv.innerHTML = html;
    } else {
      resultadoDiv.classList.add("error-box");
      resultadoDiv.innerHTML = `<h3>😕 Uy, no la encuentro</h3>
                                <p>La palabra <strong>"${inputRaw}"</strong> no está en este diccionario.</p>`;
    }
  }

  document.getElementById("entrada").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      buscar();
    }
  });

  document.getElementById("entrada").addEventListener("input", function() {
    mostrarSugerencias(this.value);
  });

  document.addEventListener("click", function(event) {
      if (!event.target.closest('.caja-busqueda') && !event.target.closest('#sugerencias-container')) {
          document.getElementById("sugerencias-container").style.display = "none";
      }
  });

  window.onload = () => document.getElementById("entrada").focus();

  // 🔹 PWA: Registro del Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('Service Worker registrado correctamente'))
        .catch(err => console.error('Error al registrar Service Worker:', err));
    });
  }
</script>
</body>
</html>
